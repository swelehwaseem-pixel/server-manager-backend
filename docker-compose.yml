version: '3.8'

services:
  # Core Management Application Backend
  server-manager-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server_manager_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # Host system mounts for Linux OS, systemd, and journal logs
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/systemd:/run/systemd:ro
      # SQLite database persistence
      - ./server_manager.db:/app/server_manager.db
      # 🔥 Dynamic Prometheus targets shared volume
      - ./prometheus_targets:/app/targets
    env_file:
      - .env
    environment:
      - ALGORITHM=HS256
      - PROCFS_PATH=/host/proc
      - DATABASE_URL=sqlite+aiosqlite:///./server_manager.db
      # 🔥 Tell the router where to write the targets file
      - PROMETHEUS_TARGETS_FILE=/app/targets/targets.json
    networks:
      - backend_network

  # Production Hardened Nginx Proxy Interface Gateway
  nginx-proxy:
    image: nginx:alpine
    container_name: server_manager_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - server-manager-backend
    networks:
      - backend_network

  # Prometheus Database Engine
  prometheus:
    image: prom/prometheus:latest
    container_name: server_manager_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
      # 🔥 Mount the same shared targets folder for file-based discovery
      - ./prometheus_targets:/etc/prometheus/targets
    networks:
      - backend_network

  # Grafana Visualization Panel App UI
  grafana:
    image: grafana/grafana:latest
    container_name: server_manager_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-your_secure_grafana_password}
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - backend_network

  # Grafana Loki Log Processing Database
  loki:
    image: grafana/loki:latest
    container_name: server_manager_loki
    restart: always
    ports:
      - "3100:3100"
    networks:
      - backend_network

  # Promtail Journal Log Scraper Collector Agent
  promtail:
    image: grafana/promtail:latest
    container_name: server_manager_promtail
    restart: always
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log/journal:/var/log/journal:ro
    networks:
      - backend_network

  # Prometheus Nginx Performance Metric Collector
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: server_manager_nginx_exporter
    restart: always
    ports:
      - "9113:9113"
    command:
      - -nginx.scrape-uri=http://nginx-proxy:8080/nginx_status
    depends_on:
      - nginx-proxy
    networks:
      - backend_network

volumes:
  grafana-storage:
  prometheus-data:

networks:
  backend_network:
    driver: bridge
