version: '3.8'

services:
  # Core Management Application Backend
  server-manager-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: server_manager_backend
    restart: always
    network_mode: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - /var/log/journal:/var/log/journal:ro
      - /run/systemd:/run/systemd:ro
      - ./server_manager.db:/app/server_manager.db
    environment:
      - SECRET_KEY=YOUR_PRODUCTION_GENERATED_RANDOM_HEX_STRING_HERE
      - ALGORITHM=HS256
      - PROCFS_PATH=/host/proc

  # Production Hardened Nginx Proxy Interface Gateway
  nginx-proxy:
    image: nginx:alpine
    container_name: server_manager_nginx
    restart: always
    network_mode: "host"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

  # Prometheus Database Engine
  prometheus:
    image: prom/prometheus:latest
    container_name: server_manager_prometheus
    restart: always
    network_mode: "host"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Grafana Visualization Panel App UI
  grafana:
    image: grafana/grafana:latest
    container_name: server_manager_grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=your_secure_grafana_password
    volumes:
      - grafana-storage:/var/lib/grafana

  # Grafana Loki Log Processing Database
  loki:
    image: grafana/loki:latest
    container_name: server_manager_loki
    restart: always
    network_mode: "host"

  # Promtail Journal Log Scraper Collector Agent
  promtail:
    image: grafana/promtail:latest
    container_name: server_manager_promtail
    restart: always
    network_mode: "host"
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log/journal:/var/log/journal:ro

  # Prometheus Nginx Performance Metric Collector
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: server_manager_nginx_exporter
    restart: always
    network_mode: "host"
    command:
      - -nginx.scrape-uri=http://127.0.0

volumes:
  grafana-storage:
  prometheus-data:
