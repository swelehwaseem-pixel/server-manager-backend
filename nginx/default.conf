events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    log_format server_json_metrics escape=json '{'
        '"time_local":"$time_local",'
        '"client_ip":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"limit_req_status":"$limit_req_status",'
        '"limit_conn_status":"$limit_conn_status",'
        '"http_user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log server_json_metrics;
    error_log  /var/log/nginx/error.log warn;

    server_tokens off;
    autoindex off;
    
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;

    client_body_timeout 12s;
    client_header_timeout 12s;
    keepalive_timeout 65s;
    send_timeout 10s;

    map $request_uri $block_malicious_probes {
        default 0;
        "~*wp-admin" 1;
        "~*phpmyadmin" 1;
        "~*\.env" 1;
        "~*metadata" 1;
    }

    limit_req_zone $binary_remote_addr zone=ip_req_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ip_conn_limit:10m;

    # HTTP -> HTTPS Redirect (Fixed server_name syntax)
    server {
        listen 80;
        listen [::]:80;
        server_name yourdomain.com; # ✅ REMOVED malformed "://"
        return 301 https://$host$request_uri;
    }

    # HTTPS Main Server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name yourdomain.com; # ✅ REMOVED malformed "://"

        # ✅ FIXED SSL paths (Added /fullchain.pem and /privkey.pem)
        ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout 5s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline'; frame-ancestors 'none';" always;

        # ✅ FIXED: Proxy to Docker service name, NOT 127.0.0.1
        location / {
            if ($block_malicious_probes) { return 444; }
            limit_conn ip_conn_limit 10;
            limit_req zone=ip_req_limit burst=20 nodelay;

            proxy_pass http://server-manager-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # ✅ FIXED: WebSocket & streaming support
        location ~* /(api/v1/metrics/live|api/v1/services/stream/|api/v1/oracle/admin/) {
            if ($block_malicious_probes) { return 444; }
            proxy_pass http://server-manager-backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }

    # Nginx Prometheus Exporter status page (Internal use only)
    server {
        listen 8080;
        server_name 127.0.0.1;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;  # Allow Docker internal network
            deny all;
        }
    }
}
